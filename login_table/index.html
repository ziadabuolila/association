<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../img/association.png" />
  <link rel="stylesheet" href="../css/table_login.css" />
  <title>المسجلين في جمعية الرحمة الخيرية بعزبة عمرو</title>

  <style>
    .status-msg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      margin-top: 5px;
    }

    .status-msg.error {
      color: #d8000c;
    }

    .status-msg.success {
      color: #007f00;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="../img/association.png" alt="Logo" draggable="false" />
    </div>
    <div class="company_name">
      <h4>جمعية الرحمة الخيرية بعزبة عمرو</h4>
    </div>
  </header>

  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>اسم المستخدم</th>
          <th>البريد الإلكتروني</th>
          <th>كلمة المرور</th>
          <th>منشئ في</th>
          <th>آخر تسجيل دخول</th>
          <th>حالة المستخدم</th>
          <th>الخيارات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</body>

</html>
